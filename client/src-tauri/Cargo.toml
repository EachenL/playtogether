[package]
name = "jt-client"
version = "0.1.0"
edition = "2021"
description = "Tauri GUI client for the JackTrip-style demo"

# Opt out of the parent workspace so the heavy Tauri dependency tree is
# isolated from the fast audio-core build.
[workspace]

[lib]
name = "jt_client"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jt-engine = { path = "../../engine" }
jt-core = { path = "../../core" }
