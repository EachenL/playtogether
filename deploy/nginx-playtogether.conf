server {

    server_name daoway.ai www.daoway.ai 1.14.105.192 _;

    root /var/www/playtogether;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/playtogether.access.log;
    error_log  /var/log/nginx/playtogether.error.log;

    gzip on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 实时状态接口：不缓存
    location = /api/status.json {
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }

    # 健康检查
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 网页版 WebSocket 桥（jt-webd）
    location /ws {
        proxy_pass http://127.0.0.1:9100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen 8443 ssl; # 应急端口：绕过 80/443 的未备案拦截
    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/daoway.ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/daoway.ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # 全站 HTTP → HTTPS（证书续期走 /.well-known/ 保留给 certbot）
    server_name daoway.ai www.daoway.ai 1.14.105.192 _;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        # 用 $host 而不是硬编码域名：这样域名被墙/被封时，直接用 IP 也能进 HTTPS
        return 301 https://$host$request_uri;
    }
}