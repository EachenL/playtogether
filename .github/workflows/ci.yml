name: CI

on:
  push:
  pull_request:

jobs:
  # 核心音频/网络引擎（core/engine/server/cli）在三大平台构建 + 测试。
  build-and-test:
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace

  # Tauri 桌面客户端在 macOS + Windows 编译检查（客户端双平台支持）。
  tauri-client:
    name: tauri-client (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check Tauri client
        working-directory: client/src-tauri
        run: cargo check
