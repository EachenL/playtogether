name: CI

on:
  push:
  pull_request:

jobs:
  # 核心音频/网络引擎（core/engine/server/cli）在三大平台构建 + 测试。
  build-and-test:
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      # Linux 上 cpal 走 ALSA，需要开发头文件（macOS/Windows 不需要）
      - name: Install Linux audio deps (ALSA)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace

  # Tauri 桌面客户端在 macOS + Windows 编译检查（客户端双平台支持）。
  tauri-client:
    name: tauri-client (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
      - name: Check Tauri client
        working-directory: client/src-tauri
        run: cargo check
